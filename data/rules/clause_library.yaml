# 标准示范条款库（AI 推荐修改建议的模板来源）
# 结构：clauses.<键名>.title / .category / .text
#   · 键名供 review_rules.yaml 的 recommend_key 引用；
#   · title    「标准示范条款库」页展示的条款名称；
#   · category 关联的审查维度（用于与规则库联动筛选）；
#   · text     示范条款正文，可被大模型基于上下文改写后回填至风险卡片。
# 兼容说明：text 字段为旧版纯文本映射的升级形式，加载器同时兼容 str 与 dict 两种写法。

clauses:
  meta_complete:
    title: 签约主体信息补全条款
    category: 主体资质
    text: |
      甲方（全称）：________________，统一社会信用代码：________________；
      乙方（全称）：________________，统一社会信用代码：________________。
      双方主体信息应完整、真实，并以营业执照载明的名称为准。

  payment_after_acceptance:
    title: 验收合格后付款条款
    category: 付款条件
    text: |
      每期款项均应在对应阶段工作成果经甲方验收合格，且乙方向甲方开具等额合法有效发票后【 】个工作日内支付；
      未通过验收的，甲方有权拒付相应款项，直至整改合格。

  ip_retained:
    title: 知识产权归属与许可条款
    category: 知识产权
    text: |
      本合同项下为履行甲方特定需求而定制开发的部分及其衍生成果，知识产权归甲方所有；
      乙方交付的通用软件、底层框架等既有知识产权仍归乙方所有，但乙方应授予甲方
      在全球范围内永久、不可撤销、可转授权的免费使用许可，以保障甲方业务连续性，
      并保证交付物不侵犯任何第三方知识产权。甲方有权自行或委托第三方对交付物进行
      二次开发与维护，乙方不得限制。

  liability_balanced:
    title: 对等违约责任条款
    category: 违约责任
    text: |
      双方均应就自身违约行为向守约方承担违约责任；任何一方违约的，应赔偿对方因此遭受的实际损失，
      包括但不限于直接损失及为维权支出的合理费用。双方责任对等，不存在单方无限责任约定。

  penalty_capped:
    title: 违约金上限条款
    category: 违约责任
    text: |
      任何一方违反本合同约定，应向对方支付违约金，违约金以违约部分对应金额的【20】%为上限，
      且不超过给对方造成的实际损失；违约金不足以弥补损失的，按实际损失赔偿。

  jurisdiction_standard:
    title: 标准争议解决管辖条款
    category: 争议管辖
    text: |
      因本合同引起的或与本合同有关的任何争议，双方应友好协商解决；协商不成的，
      提交合同签订地（或被告住所地/合同履行地/标的物所在地）有管辖权的人民法院诉讼解决。

  confidentiality_term:
    title: 保密义务与期限条款
    category: 保密义务
    text: |
      双方对履约过程中知悉的对方商业秘密承担保密义务，保密期限自本合同生效之日起至合同终止后【3】年；
      法律法规另有规定或对方书面同意提前解除的除外。

  force_majeure_notice:
    title: 不可抗力通知与举证条款
    category: 不可抗力
    text: |
      因不可抗力不能履行本合同的，受影响方应在不可抗力发生后【3】日内书面通知对方，
      并在【15】日内提供有关权威机构出具的证明文件；未及时通知导致损失扩大的，就扩大部分不免责。

  pi_protection:
    title: 个人信息保护条款
    category: 个人信息保护
    text: |
      双方处理履约过程中涉及的个人信息，应遵循合法、正当、必要原则，明确处理目的、方式与最小必要范围；
      任何一方受托处理个人信息的，应取得信息主体单独同意，并采取加密、去标识化等安全措施，
      发生或可能发生泄露的应在【24】小时内通知对方并启动应急补救；未经对方书面同意，
      不得将个人信息用于约定目的之外或转让给第三方。

  data_crossborder_security:
    title: 数据出境安全评估条款
    category: 数据合规
    text: |
      本合同涉及数据或信息向境外提供（含出境、跨境传输、境外接收方处理）的，应依法履行
      数据出境安全评估或标准合同备案义务；境外接收方应具备相应的数据安全保护能力，
      双方应约定出境数据的范围、目的、期限与再转移限制，并明确违约责任与监管配合义务。

  data_processing_security:
    title: 数据处理与保密安全条款
    category: 数据合规
    text: |
      双方因履行本合同向对方提供或委托处理的数据，应仅用于本合同目的，不得超范围共享或对外提供；
      受托处理方应采取访问控制、加密传输与存储、日志审计等必要安全措施，并定期提交安全合规说明；
      合同终止后【30】日内应返还或销毁相关数据及其载体，法律另有规定的除外。

  antimonopoly_compliance:
    title: 反垄断合规条款
    category: 反垄断
    text: |
      双方均应遵循《反垄断法》等法律法规，不得达成或实施固定/维持转售价格、横向价格垄断协议；
      本合同约定经销商销售政策的，不得限定其向第三人转售商品的最低价格，亦不得以窜货违约金等
      方式不当限制正当的跨区域销售；如条款执行中涉及排他或地域限制，应事先评估其市场影响并调整。

  anti_bribery:
    title: 反商业贿赂与廉洁从业条款
    category: 廉洁合规
    text: |
      双方均应遵循《反不正当竞争法》等法律法规，禁止向对方或对方关联方的员工、代理人给付或承诺给付
      回扣、贿赂、不当利益以谋取交易机会或竞争优势。任何一方人员实施商业贿赂、索贿或收受不当利益的，
      受害方有权单方解除合同并追偿因此遭受的损失，涉嫌违法的应报送有关机关处理；
      双方各自对其人员的操守负责，并应建立相应的廉洁承诺与监督机制。

  termination_balance:
    title: 对等解除权与行使程序条款
    category: 合同解除与终止
    text: |
      除法定或约定的解除情形外，任何一方解除、变更或终止本合同，均应经双方协商一致并以书面形式确认；
      一方依约单方解除的，应提前【30】日书面通知对方并说明理由。双方解除权对等，
      不存在一方可任意、无条件解除或变更合同的约定；解除通知应以书面形式送达对方。

  auto_renew_notice:
    title: 续约与退出机制条款
    category: 合同解除与终止
    text: |
      本合同期满前【30】日，双方可协商续约；任何一方不愿续约的，应于期满前【30】日书面通知对方，
      合同到期自动终止，不作自动续约。确需约定自动续约的，应明确续约期限、
      提前通知退出期（不少于【30】日）及退出方式，保障双方的知情与选择权利。
